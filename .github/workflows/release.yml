# [v3.5.0] Phase 45 Task CI-2: GitHub Actions Release 워크플로.
# main push/manual dispatch는 Linux musl/Windows MSVC build·smoke·attestation을 검증합니다.
# 태그 push(v*)만 동일 검증 이후 GitHub Release를 게시합니다.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/audit/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.94.1"

permissions: {}

jobs:
  # 릴리스 전 품질 게이트 (태그 push에서도 검증)
  quality-gate:
    name: Pre-release Quality Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust and supply-chain tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.4 --locked
      - run: cargo fetch --locked
      - run: bash ./scripts/check-version-sync.sh
      - run: cargo fmt --check
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked --no-fail-fast
      - run: cargo audit
      - run: cargo deny check

  build:
    name: Build (${{ matrix.artifact }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: smlcli-linux-x86_64
            binary: smlcli
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: smlcli-windows-x86_64.exe
            binary: smlcli.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}" --toolchain "$RUST_TOOLCHAIN"

      - name: Set reproducible source epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      # Linux musl 빌드에 필요한 musl-tools 설치
      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test release binary
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" --version
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" --help

      - name: Prepare binary, checksum, and SPDX SBOM
        shell: bash
        run: |
          python scripts/prepare-release-artifact.py \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --artifact "dist/${{ matrix.artifact }}"
          python scripts/generate-sbom.py \
            --target "${{ matrix.target }}" \
            --output "dist/${{ matrix.artifact }}.spdx.json"

      - name: Verify generated checksum and SPDX SBOM
        shell: bash
        run: python scripts/verify-release-artifacts.py dist

      - name: Generate signed Sigstore provenance attestation
        id: attest-provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/${{ matrix.artifact }}.spdx.json

      - name: Generate signed SPDX SBOM attestation
        id: attest-sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/${{ matrix.artifact }}
          sbom-path: dist/${{ matrix.artifact }}.spdx.json

      - name: Record attestation URLs
        shell: bash
        run: |
          echo "Provenance ${{ steps.attest-provenance.outputs.attestation-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SBOM ${{ steps.attest-sbom.outputs.attestation-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Sigstore provenance and SBOM attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "dist/${{ matrix.artifact }}" \
            -R "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify "dist/${{ matrix.artifact }}" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish verified GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Verify artifact checksums
        run: python scripts/verify-release-artifacts.py release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
