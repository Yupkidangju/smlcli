# [v3.5.0] Phase 45 Task CI-1: GitHub Actions CI 워크플로.
# 모든 push/PR에 대해 fmt/clippy/test 게이트를 수행합니다.
# 실패 시 PR 머지가 차단됩니다.

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.94.1"

permissions:
  contents: read

jobs:
  check:
    name: Locked Quality and Supply-chain Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run tests
        run: cargo test --all-targets --locked --no-fail-fast

      - name: Install pinned supply-chain tools
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.4 --locked

      - name: RustSec advisory gate
        run: cargo audit

      - name: License, source, ban, and advisory policy
        run: cargo deny check

  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify version consistency
        run: bash ./scripts/check-version-sync.sh
